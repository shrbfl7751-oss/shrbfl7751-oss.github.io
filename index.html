html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.6;padding-inline:20px;padding-block:20px 40px;word-break:keep-all;overflow-wrap:break-word;-webkit-font-smoothing:antialiased;text-align:center}
.wrap{max-width:440px;margin:0 auto;display:flex;flex-direction:column;align-items:center}
h1,h2,h3,p{margin:0}
.hl{color:var(--accent)}
.top{width:100%;display:flex;justify-content:space-between;align-items:center;min-height:32px}
.top .ghost-link{appearance:none;border:0;background:none;font:500 15px var(--f);color:var(--ink);cursor:pointer;padding:4px 2px}
.top .ghost-link:disabled{visibility:hidden}
.top.tri{display:grid;grid-template-columns:1fr auto 1fr;gap:8px}
.top.tri>:first-child{justify-self:start}.top.tri>:last-child{justify-self:end}
.top-logo{display:flex;align-items:center;justify-content:center}
.top-logo img{height:20px;width:auto;display:block}
.top-logo .lg-d{display:none}
@media not all{:root:not([data-theme="light"]) .top-logo .lg-l{display:none}:root:not([data-theme="light"]) .top-logo .lg-d{display:block}}
:root[data-theme="x-dark-off"] .top-logo .lg-l{display:none}:root[data-theme="x-dark-off"] .top-logo .lg-d{display:block}
.top-next{appearance:none;border:0;cursor:pointer;font:800 17px var(--f);color:#26335F;background:#fff;padding:12px 22px;border-radius:999px;box-shadow:0 4px 14px rgba(0,0,0,.25);white-space:nowrap}
.top-next:active{transform:scale(.96)}
.again-link{appearance:none;border:0;background:none;font:600 14px var(--f);color:var(--muted);cursor:pointer;padding:6px;align-self:center;text-decoration:underline;text-underline-offset:3px}
.wrap.wait .res-sticky{visibility:hidden}
.wrap.res>.res-sticky{position:fixed!important;z-index:20!important}
.res-sticky .btn{animation:none;width:100%;display:block;position:relative;overflow:hidden}
.res-sticky .btn.is-next{animation:nxPulse 2.2s ease-in-out infinite}
.res-sticky .btn.is-next::after{content:"";position:absolute;top:0;bottom:0;left:-40%;width:35%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.45),transparent);transform:skewX(-18deg);animation:nxShine 2.2s ease-in-out infinite}
.res-sticky .btn .nx-ar{display:inline-block;font-style:normal;margin-left:4px;animation:nudgeX 1.1s ease-in-out infinite}
@keyframes nxPulse{0%,100%{transform:scale(1);box-shadow:0 12px 24px -8px rgba(58,90,171,.55)}50%{transform:scale(1.025);box-shadow:0 14px 30px -6px rgba(58,90,171,.75)}}
@keyframes nxShine{0%,40%{left:-40%}80%,100%{left:120%}}
@media (prefers-reduced-motion:reduce){.res-sticky .btn.is-next,.res-sticky .btn.is-next::after,.res-sticky .btn .nx-ar{animation:none!important}}
#pBtn{background:#FFD45C!important;color:#26335F!important;font-weight:800;box-shadow:0 10px 22px -8px rgba(232,170,20,.6)!important}
#pBtn:active{background:#F5C53A!important}
.lu-teaser{appearance:none;border:0;cursor:pointer;width:100%;margin-top:14px;display:flex;align-items:center;gap:14px;padding:14px;border-radius:22px;background:var(--surface);box-shadow:var(--sh-2);text-align:left;font-family:var(--f);color:var(--ink)}
.lt-img{position:relative;flex:0 0 46%;aspect-ratio:1200/667;border-radius:14px;overflow:hidden;background:#EDEDED}
.lt-img img{width:100%;height:100%;object-fit:cover;display:block;animation:kb 9s ease-in-out infinite alternate}
.lt-shine{position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.65) 50%,transparent 65%);transform:translateX(-120%);animation:shine 3.2s ease-in-out 1s infinite}
.lt-txt{display:flex;flex-direction:column;gap:4px;min-width:0}
.lt-txt small{font-size:11.5px;font-weight:700;color:var(--muted)}
.lt-txt b{font-size:16.5px;font-weight:900;line-height:1.3;letter-spacing:-.02em}
.lt-txt em{font-style:normal;font-size:13px;font-weight:800;color:#26335F;background:#FFD45C;align-self:flex-start;padding:5px 11px;border-radius:99px;margin-top:4px}
.lt-txt em i,.lu-link i{display:inline-block;font-style:normal;animation:nudgeX 1.4s ease-in-out infinite}
.lu-top-btn{appearance:none;border:0;cursor:pointer;font:800 13px var(--f);color:#26335F;background:#FFD45C;padding:7px 12px;border-radius:999px;white-space:nowrap;box-shadow:0 4px 12px rgba(0,0,0,.25);animation:luPulse 2.4s ease-in-out infinite}
.lu-top-btn i{font-style:normal;display:inline-block;animation:nudgeX 1.4s ease-in-out infinite}
@keyframes luPulse{0%,100%{box-shadow:0 4px 12px rgba(0,0,0,.25),0 0 0 0 rgba(255,212,92,.6)}50%{box-shadow:0 4px 12px rgba(0,0,0,.25),0 0 0 7px rgba(255,212,92,0)}}
.wrap.wait .lu-top-btn{visibility:hidden}
.multi-chip{display:inline-block;font-size:12px;font-weight:800;color:var(--accent);background:var(--tint);padding:4px 10px;border-radius:99px;margin-bottom:8px}

.score-card{--gc:#3A5AAB;--gt:#ECEFF8;width:100%;margin-top:8px;padding:12px 14px 12px;border-radius:18px;background:linear-gradient(180deg,var(--gt),#fff 140%);border:1.5px solid color-mix(in srgb,var(--gc) 35%,transparent)}
.score-card.g1{--gc:#3A5AAB;--gt:#ECEFF8}.score-card.g2{--gc:#3A5AAB;--gt:#ECEFF8}.score-card.g3{--gc:#3A3638;--gt:#F2F1F3}.score-card.g4{--gc:#3A3638;--gt:#F2F1F3}
.score-card .score-row.big{border-top:0;margin:0;padding:0}
.score-card .score-row small{color:color-mix(in srgb,var(--gc) 70%,#333);font-weight:700}
.score-card .score-row.big strong{font-size:46px!important;color:var(--gc)}
.score-card .score-row strong span:not(.cnt){color:color-mix(in srgb,var(--gc) 55%,#888)}
.score-card .badge{background:var(--gc)!important;color:#fff!important;font-weight:800;padding:7px 13px;box-shadow:0 6px 14px -6px var(--gc)}
.gauge{margin-top:10px}
.g-track{position:relative;height:10px;border-radius:99px;background:linear-gradient(90deg,#F2F1F3 0 50%,#F2F1F3 50% 70%,#ECEFF8 70% 85%,#ECEFF8 85%)}
.g-track i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:linear-gradient(90deg,color-mix(in srgb,var(--gc) 55%,#fff),var(--gc))}
.g-track b{position:absolute;top:50%;width:18px;height:18px;border-radius:50%;background:#fff;border:4px solid var(--gc);transform:translate(-50%,-50%);box-shadow:0 2px 6px rgba(0,0,0,.18)}
.slide:not(.seen) .g-track i{width:0!important}.slide:not(.seen) .g-track b{left:0!important}
.slide.seen .g-track i{animation:growx 1.1s cubic-bezier(.2,.8,.2,1) .3s both}
.slide.seen .g-track b{animation:gslide 1.1s cubic-bezier(.2,.8,.2,1) .3s both}
@keyframes gslide{from{left:0}}
.g-lbl{display:grid;grid-template-columns:50fr 20fr 15fr 15fr;margin-top:5px;font-size:10.5px;font-weight:700;color:var(--muted);letter-spacing:-.03em}
.g-lbl span{text-align:center;white-space:nowrap}
.score-card.g4 .g-lbl span:nth-child(1),.score-card.g3 .g-lbl span:nth-child(2),.score-card.g2 .g-lbl span:nth-child(3),.score-card.g1 .g-lbl span:nth-child(4){color:var(--gc)}

.last-btn{appearance:none;border:0;cursor:pointer;display:flex;align-items:center;gap:10px;margin:16px auto 0;padding:10px 16px 10px 12px;border-radius:16px;background:rgba(255,255,255,.12);border:1.5px solid rgba(255,212,92,.7);color:#fff;font-family:var(--f);text-align:left;box-shadow:0 8px 20px -10px rgba(0,0,0,.5);animation:luPulse 2.4s ease-in-out infinite;position:relative;z-index:2}
.last-btn .lb-ic{font-size:20px}
.last-btn .lb-tx{display:flex;flex-direction:column;line-height:1.25}
.last-btn small{font-size:11.5px;color:#FFD45C;font-weight:700}
.last-btn b{font-size:15px;font-weight:800}
.last-btn i{font-style:normal;font-size:18px;color:#FFD45C;animation:nudgeX 1.4s ease-in-out infinite}
.top-logo,.lu-top img{cursor:pointer}
.top-logo:active,.lu-top img:active{opacity:.7}
.st-head{display:flex;align-items:center;gap:12px;width:100%}
.st-baby{position:relative;flex:0 0 72px;height:72px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0%,#ECEFF8 50%,#8093CA 100%);overflow:hidden;border:3px solid #fff;box-shadow:0 8px 16px -8px rgba(20,60,140,.5)}
.st-baby img{position:absolute;left:50%;top:4px;width:78px;transform:translateX(-50%)}
.st-head .rec-title{margin:0;font-size:20px;text-align:left}
.st-sub{margin:2px 0 0;font-size:13px;color:var(--sub);text-align:left}
.st-sum{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;width:100%}
.st-chip{background:var(--soft);border-radius:14px;padding:9px 8px;display:flex;flex-direction:column;align-items:center;gap:1px;text-align:center}
.st-chip small{font-size:11px;color:var(--muted);font-weight:700}
.st-chip b{font-size:20px;font-weight:900;color:var(--ink);letter-spacing:-.02em;line-height:1.2}
.st-chip b span{font-size:11.5px;color:var(--muted);font-weight:700;margin-left:1px}
.st-chip b.up{color:#3A5AAB}.st-chip b.down{color:#3A3638}
.st-chip-sub{font-size:10.5px;color:var(--muted);font-weight:600}
.st-prog{width:80%;height:5px;border-radius:9px;background:var(--line);margin-top:4px;overflow:hidden}
.st-prog i{display:block;height:100%;background:var(--accent);border-radius:9px}
.st-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;width:100%}
.st-cell{position:relative;--gc:#3A5AAB;--gt:#ECEFF8;border-radius:16px;padding:22px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0;background:var(--soft);border:1.5px solid transparent}
.st-cell.g1{--gc:#3A5AAB;--gt:#ECEFF8}.st-cell.g2{--gc:#3A5AAB;--gt:#ECEFF8}.st-cell.g3{--gc:#3A3638;--gt:#F2F1F3}.st-cell.g4{--gc:#3A3638;--gt:#F2F1F3}
.st-cell.done{background:var(--gt);border-color:color-mix(in srgb,var(--gc) 35%,transparent)}
.st-cell.cur{box-shadow:0 0 0 2.5px var(--gc),0 8px 16px -8px var(--gc)}
.st-w{position:absolute;top:5px;left:8px;font-size:10.5px;font-weight:800;color:var(--muted)}
.st-cell.done .st-w{color:var(--gc)}
.st-now{position:absolute;top:-9px;left:50%;transform:translateX(-50%);font-style:normal;font-size:10px;font-weight:800;color:#fff;background:var(--gc,#3A5AAB);padding:2px 7px;border-radius:99px;white-space:nowrap;z-index:2}
.st-cell.now .st-now{background:#3A5AAB}
.st-stamp{width:46px;height:46px;border-radius:50%;background:#fff;border:2.5px dashed var(--gc);display:grid;place-items:center;transform:rotate(-10deg);box-shadow:inset 0 0 0 3px #fff,0 3px 8px -4px var(--gc)}
.st-stamp svg{width:40px;height:40px;position:static!important;transform:none!important}
.st-sc{font-size:16px;font-weight:900;color:var(--gc);line-height:1.1;margin-top:2px}
.st-sc small{font-size:10px;margin-left:1px}
.st-dt{font-size:10px;color:var(--muted);font-weight:600;white-space:nowrap;letter-spacing:-.03em}
.st-empty{width:46px;height:46px;border-radius:50%;border:2px dashed var(--line);display:grid;place-items:center;font-size:18px;color:var(--muted);background:#fff}
.st-cell.now{background:#fff;border:1.5px dashed #3A5AAB}
.st-cell.now .st-empty{border-color:#3A5AAB;color:#3A5AAB;animation:luPulse 2s ease-in-out infinite}
.st-go{font-size:12.5px;color:#3A5AAB;font-weight:800;margin-top:2px}
.st-open{font-size:11.5px;color:var(--muted);font-weight:700;margin-top:2px;white-space:nowrap}
.st-cell.lock{opacity:.8}
.st-cell.goal{background:linear-gradient(160deg,#FFF6D6,#FFE9A8);opacity:1}
.st-cell.goal .st-empty{border-color:#E8B33A;background:#FFFBEA}
.st-trophy{position:absolute;right:4px;top:2px;font-style:normal;font-size:16px}
.slide:not(.seen) .st-cell.done .st-stamp{opacity:0}
.slide.seen .st-cell.done .st-stamp{animation:stampIn .5s cubic-bezier(.3,1.6,.5,1) calc(.3s + var(--d)) both}
@keyframes stampIn{0%{opacity:0;transform:rotate(-10deg) scale(1.9)}60%{opacity:1;transform:rotate(-14deg) scale(.92)}100%{opacity:1;transform:rotate(-10deg) scale(1)}}
.st-spark{width:100%;height:auto;display:block;margin-top:2px}
.st-spark .dot{stroke:#fff;stroke-width:2;fill:var(--gc,#3A5AAB)}
.st-spark .dot.g1{fill:#3A5AAB}.st-spark .dot.g2{fill:#3A5AAB}.st-spark .dot.g3{fill:#3A3638}.st-spark .dot.g4{fill:#3A3638}
@keyframes drawL{from{stroke-dashoffset:600}to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){.slide.seen .st-cell.done .st-stamp,.slide.seen .st-path,.st-cell.now .st-empty{animation:none!important}}

.st-done{position:relative;overflow:hidden;width:100%;display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:18px;background:linear-gradient(120deg,#FFF3C4,#FFE08A 60%,#FFD45C);box-shadow:0 10px 22px -12px rgba(200,140,0,.7);text-align:left}
.st-done-ic{font-size:36px;animation:trBob 1.6s ease-in-out infinite;display:inline-block}
@keyframes trBob{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-5px) rotate(6deg)}}
.st-done b{font-family:"Pretendard","Noto Sans KR",sans-serif;font-weight:400;font-size:20px;color:#5A3D00}
.st-done p{margin:2px 0 0;font-size:12.5px;color:#7A5600;line-height:1.5}
.st-done em{font-style:normal;font-weight:900;color:#26335F}
.st-done .cf{position:absolute;top:-10px;width:7px;height:11px;border-radius:2px;animation:conf 2.6s linear infinite;opacity:.9}
.cf.c1{left:12%;background:#3A5AAB}.cf.c2{left:30%;background:#3A3638;animation-delay:.5s}.cf.c3{left:52%;background:#3A5AAB;animation-delay:1s}.cf.c4{left:68%;background:#fff;animation-delay:1.4s}.cf.c5{left:82%;background:#3A5AAB;animation-delay:.8s}.cf.c6{left:93%;background:#3A3638;animation-delay:1.9s}
@keyframes conf{0%{transform:translateY(0) rotate(0)}100%{transform:translateY(110px) rotate(540deg)}}
.st-grid.all .st-cell:last-child{background:linear-gradient(160deg,#FFF6D6,#FFE08A);border-color:#E8B33A;box-shadow:0 0 0 2.5px #E8B33A,0 10px 20px -8px rgba(200,140,0,.6)}
.st-grid.all .st-cell:last-child .st-now{background:#C98A00}
.st-medal{position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);font-size:10px;font-weight:900;color:#fff;background:#C98A00;padding:2px 8px;border-radius:99px}
@media (prefers-reduced-motion:reduce){.st-done .cf,.st-done-ic{animation:none!important}.st-done .cf{display:none}}
.rec-block.sp-on{background:linear-gradient(180deg,#ECEFF8 0%,#8093CA 26%,#3A5AAB 52%,#3A5AAB 100%);box-shadow:var(--sh-1);padding:22px 14px 16px;position:relative;overflow:hidden}
.rec-block.sp-on .st-head{position:relative;z-index:1}
.rec-block.sp-on .rec-title{color:#26335F;font-family:var(--f);font-weight:800;font-size:22px;letter-spacing:-.04em;line-height:1.3}
.rec-block.sp-on .rec-title span{color:#3A5AAB;background:linear-gradient(transparent 62%,rgba(255,255,255,.75) 62%);padding:0 2px}
.rec-block.sp-on .st-sub{color:#26335F;font-weight:600;max-width:210px}
.rec-block.sp-on .st-head{padding-right:96px}
.rec-block.sp-on .st-baby{display:none}
.sp-hero-tools{position:absolute;right:-10px;top:-8px;width:120px;height:84px;opacity:.95;pointer-events:none;z-index:0}
.sp-hero-tools img{position:absolute;width:50px;filter:drop-shadow(0 8px 10px rgba(30,50,140,.25))}
.sp-hero-tools img:nth-child(1){left:2px;top:22px;transform:rotate(-14deg);animation:spFloat 3s ease-in-out infinite}
.sp-hero-tools img:nth-child(2){left:34px;top:0;width:56px;animation:spFloat 3s ease-in-out .5s infinite}
.sp-hero-tools img:nth-child(3){left:70px;top:26px;transform:rotate(12deg);animation:spFloat 3s ease-in-out 1s infinite}
@keyframes spFloat{0%,100%{translate:0 0}50%{translate:0 -5px}}
.sp-sum{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;width:100%;position:relative;z-index:1}
.sp-sum>div{background:rgba(255,255,255,.55);backdrop-filter:blur(4px);border-radius:14px;padding:8px 6px;text-align:center;display:flex;flex-direction:column}
.sp-sum small{font-size:11px;color:#26335F;font-weight:700}
.sp-sum b{font-size:19px;font-weight:900;color:#26335F;line-height:1.25}
.sp-sum b span{font-size:11px;margin-left:1px;color:#26335F}
.sp-card{width:100%;background:#fff;border-radius:22px;padding:18px 10px 10px;box-shadow:0 14px 28px -14px rgba(20,40,120,.55)}
.sp-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 6px}
.sp-cell{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.sp-pill{background:var(--c);color:#fff;font-family:"Pretendard","Noto Sans KR",sans-serif;font-size:14px;padding:4px 0;width:92%;text-align:center;border-radius:99px;box-shadow:0 4px 10px -6px var(--c)}
.sp-seal{position:relative;width:64px;height:64px;border-radius:50%;display:grid;place-items:center}
.sp-seal img{width:74%;height:auto}
.sp-seal.off{background:radial-gradient(circle at 35% 30%,#F4F4F7,#E3E3EA 70%);box-shadow:inset 0 0 0 3px #fff,inset 0 0 0 4.5px #E9E9EF}
.sp-seal.off::after{content:"";position:absolute;inset:0;border-radius:50%;background-image:radial-gradient(rgba(255,255,255,.9) .8px,transparent 1.2px),radial-gradient(rgba(180,180,195,.35) .8px,transparent 1.2px);background-size:6px 6px,7px 7px;background-position:0 0,3px 2px;opacity:.8}
.sp-seal.off img{opacity:1;position:relative;z-index:1;filter:drop-shadow(0 0 1px rgba(160,160,180,.6))}
.sp-seal.on{background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--c) 70%,#fff),var(--c) 70%);box-shadow:inset 0 0 0 3px var(--c),inset 0 0 0 5px rgba(255,255,255,.95),0 6px 12px -6px var(--c);transform:rotate(-12deg)}
.sp-seal.on::after{content:"";position:absolute;inset:0;border-radius:50%;background-image:radial-gradient(rgba(255,255,255,.35) .7px,transparent 1.2px);background-size:5px 5px;mix-blend-mode:overlay}
.sp-tag{position:relative;display:inline-flex;align-items:baseline;gap:1px;padding:3px 10px;font-size:10.5px;font-weight:800;color:#fff;background:var(--gc,#3A5AAB);border-radius:4px}
.sp-tag b{font-size:14px;font-weight:900}
.sp-tag::before,.sp-tag::after{content:"";position:absolute;top:50%;width:6px;height:6px;border-radius:50%;background:#fff;transform:translateY(-50%)}
.sp-tag::before{left:-3px}.sp-tag::after{right:-3px}
.sp-tag.g1{--gc:#3A5AAB}.sp-tag.g2{--gc:#3A5AAB}.sp-tag.g3{--gc:#3A3638}.sp-tag.g4{--gc:#3A3638}
.sp-dt{font-size:10px;color:var(--muted);font-weight:600;white-space:nowrap;letter-spacing:-.03em;margin-top:-3px}
.sp-open{font-size:10.5px;color:var(--muted);font-weight:700;white-space:nowrap;letter-spacing:-.03em}
.sp-cell.now .sp-seal.off{box-shadow:inset 0 0 0 3px #fff,0 0 0 2px var(--c);animation:luPulse 2s ease-in-out infinite}
.sp-cell.now .sp-open{color:var(--c)}
.sp-cell.goal .sp-pill{background:linear-gradient(90deg,#F5B731,#3A3638)}
.sp-cell.cur .sp-dt{color:var(--c);font-weight:800}
.slide{overflow-x:clip}
.sp-card{overflow:clip;overflow-clip-margin:40px}
.sp-tool{position:absolute;top:-6px;left:50%;width:58px;margin-left:-6px;z-index:3;pointer-events:none;opacity:0}
@keyframes spIn{0%{opacity:0;transform:rotate(-12deg) scale(1.7)}60%{opacity:1;transform:rotate(-16deg) scale(.92)}100%{opacity:1;transform:rotate(-12deg) scale(1)}}
@keyframes spPress{0%{opacity:0;transform:translate(26px,-46px) rotate(24deg)}25%{opacity:1;transform:translate(10px,-30px) rotate(10deg)}36%{opacity:1;transform:translate(-14px,6px) rotate(0)}46%{opacity:1;transform:translate(-14px,10px) rotate(0) scale(.96,.92)}62%{opacity:1;transform:translate(14px,-34px) rotate(16deg)}100%{opacity:0;transform:translate(30px,-60px) rotate(26deg)}}
.rec-block.sp-on .st-spark{margin-top:8px}
.rec-block.sp-on .same-note{background:rgba(255,255,255,.85)}
.rec-block.sp-on .reset-box{color:#fff}
.rec-block.sp-on .reset-box .linkish{color:rgba(255,255,255,.9)}
@media (prefers-reduced-motion:reduce){.sp-hero-tools img,.sp-card.go .sp-tool,.sp-card.go .sp-cell.done .sp-seal.on,.sp-card .st-spark .dot,.sp-cell.now .sp-seal.off{animation:none!important}.sp-tool{display:none}}

.sp-seal.on{width:68px;height:68px}

.slide{flex:0 0 100%;min-width:0;scroll-snap-align:start;display:flex;flex-direction:column;align-items:center;padding:0 2px 28px}
.slide.intro-anim .head>*,.slide.intro-anim .stage>*{animation:rise .55s cubic-bezier(.2,.8,.25,1) both;animation-delay:calc(var(--i,0)*90ms)}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.dots{display:flex;gap:10px;justify-content:center;margin-top:6px}
.dots button{appearance:none;border:0;padding:0;width:9px;height:9px;border-radius:50%;background:color-mix(in srgb,var(--muted) 45%,transparent);cursor:pointer;transition:background .2s,transform .2s}
.dots button.on{background:var(--accent);transform:scale(1.1)}
.char{width:150px}
.char svg{width:100%;height:auto;display:block;animation:bob 2.6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.char-name{font-size:15px;font-weight:800;color:var(--accent-2);letter-spacing:-.01em}
.badge{font-size:12.5px;font-weight:700;padding:4px 11px;border-radius:99px;background:var(--mint);color:var(--mint-ink)}
.score-row{display:flex;align-items:center;justify-content:space-between;width:100%;gap:10px}
.score-row .l{display:flex;flex-direction:column;text-align:left;gap:1px}
.score-row small{font-size:12px;color:var(--muted);font-weight:500}
.score-row strong{font-size:28px;font-weight:900;letter-spacing:-.03em;line-height:1.1}
.score-row strong span{font-size:14px;color:var(--muted);margin-left:2px}
.ring{--p:0;width:132px;height:132px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--line) 0)}
.ring>div{width:108px;height:108px;border-radius:50%;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.ring b{font-size:40px;font-weight:900;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.ring small{font-size:12px;color:var(--muted);font-weight:500}
.parts{display:flex;flex-direction:column;gap:9px;width:100%}
.part{display:grid;grid-template-columns:62px 1fr 42px;align-items:center;gap:10px;font-size:13px}
.part span{color:var(--sub);text-align:left;font-weight:500}
.part em{font-style:normal;text-align:right;font-weight:800;font-variant-numeric:tabular-nums}
.pbar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.four{grid-template-columns:repeat(4,1fr)!important}
.four div{padding:10px 0!important}
.four span{font-size:12px!important}
.tips{display:flex;flex-direction:column;gap:10px;width:100%}
.tip{display:flex;align-items:center;gap:12px;text-align:left;padding:13px 14px;border-radius:14px;background:var(--soft)}
.tip span{flex:none;width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:900;font-size:13px}
.tip p{font-size:14.5px;min-width:0;font-weight:500;letter-spacing:-.01em}
.alert{width:100%;padding:13px 14px;border-radius:14px;background:var(--alert-bg);color:var(--alert);font-size:13.5px;font-weight:600;text-align:left}
.alert b{display:block;font-size:14.5px;font-weight:800;margin-bottom:2px}
.road{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;width:100%}
.road div{border-radius:14px;padding:10px 2px;background:var(--soft);display:flex;flex-direction:column;gap:3px;min-width:0;color:var(--muted)}
.road div.on{background:var(--accent);color:var(--accent-ink)}
.road small{font-size:11px;font-weight:500}
.road b{font-size:12px;line-height:1.3;font-weight:800;letter-spacing:-.01em}
.prod-name{font-size:18px;font-weight:900;letter-spacing:-.03em}
.howaru{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--sub);font-weight:500}
.hw{font-size:11px;font-weight:900;letter-spacing:.04em;color:var(--accent-2);border:1.5px solid var(--accent);border-radius:8px;padding:2px 6px}
/* report receipt */
.printer{position:relative;z-index:3;width:100%;height:54px;border-radius:28px;background:linear-gradient(180deg,#F4F6F8 0%,#C9CFD6 45%,#9AA3AD 100%);box-shadow:0 14px 28px -12px rgba(24,48,72,.45),inset 0 2px 0 rgba(255,255,255,.9);display:grid;place-items:center}
.slot{width:86%;height:12px;border-radius:99px;background:linear-gradient(180deg,#39414A,#5C656F);box-shadow:inset 0 2px 3px rgba(0,0,0,.5)}
.paper-wrap{width:84%;margin-top:-20px;overflow:hidden;padding:0 8px 26px}
.paper{--pbg:#FCFCFA;position:relative;background:var(--pbg);color:#333033;padding:30px 20px 34px;display:flex;flex-direction:column;align-items:center;gap:8px;box-shadow:0 20px 34px -18px rgba(24,48,72,.35);
 -webkit-mask:radial-gradient(circle 6px at 50% 100%,transparent 5.5px,#000 6px) 0 100%/14px 100% repeat-x;mask:radial-gradient(circle 6px at 50% 100%,transparent 5.5px,#000 6px) 0 100%/14px 100% repeat-x}
.slide.seen .paper-wrap{animation:none!important;opacity:1!important}
.slide.seen .paper{animation:print 1.6s cubic-bezier(.3,.7,.3,1) .35s both}
@keyframes print{from{transform:translateY(-100%)}to{transform:none}}
@media (prefers-reduced-motion:reduce){.slide.seen .paper{animation:none}}
.rp-brand{font-size:11px;font-weight:800;letter-spacing:.14em;color:#3A5AAB}
.rp-title{font-size:20px;font-weight:900;letter-spacing:-.03em}
.rp-sep{width:100%;border-top:1.5px dashed #C9CED4;margin:4px 0}
.rp-line{width:100%;display:flex;justify-content:space-between;align-items:baseline;font-size:14px;gap:12px}
.rp-line span{color:#5A636D}
.rp-line em{font-style:normal;font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.rp-line small{font-size:11px;color:#9AA2AB;font-weight:500}
.rp-total{width:100%;display:flex;justify-content:space-between;align-items:baseline}
.rp-total span{font-size:13px;font-weight:800;letter-spacing:.12em}
.rp-total b{font-size:30px;font-weight:900;color:#3A5AAB;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.rp-res{font-size:13px;font-weight:700;color:#3A434D}
.rp-date{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:2px}
.barcode{height:46px;max-width:100%}
.rp-note{font-size:10.5px;color:#9AA2AB}
/* stamp + week dots on receipt */
.stamp-row{width:100%;display:flex;align-items:center;justify-content:center;gap:16px;margin:4px 0}
.stamp{position:relative;width:86px;height:86px;border-radius:50%;border:3px solid #3A3638;color:#3A3638;display:flex;flex-direction:column;align-items:center;justify-content:center;transform:rotate(-12deg);box-shadow:inset 0 0 0 3px #FCFCFA,inset 0 0 0 4.5px #3A3638;opacity:.92}
.stamp-in{width:50px;margin-top:-4px}
.stamp-in svg{width:100%;height:auto;display:block;animation:none!important}
.stamp span{font-size:9.5px;font-weight:900;letter-spacing:.12em;margin-top:-4px}
.slide.seen .stamp{animation:thump .45s cubic-bezier(.3,1.6,.5,1) 1.9s both}
@keyframes thump{from{transform:rotate(-12deg) scale(1.8);opacity:0}to{transform:rotate(-12deg) scale(1);opacity:.92}}
.stamp-txt{display:flex;flex-direction:column;text-align:left}
.stamp-txt small{font-size:11px;color:#9AA2AB}
.stamp-txt b{font-size:16px;font-weight:800;font-variant-numeric:tabular-nums}
.rp-line.next em{color:#3A5AAB}
.wdots{display:flex;align-items:center;gap:6px}
.wdots i{width:9px;height:9px;border-radius:50%;border:1.5px solid #C9CED4}
.wdots i.on{background:#3A5AAB;border-color:#3A5AAB}
.wdots i.cur{box-shadow:0 0 0 3px rgba(58,90,171,.2)}
.wdots span{font-size:11.5px;font-weight:700;color:#5A636D;margin-left:4px}
@media (prefers-reduced-motion:reduce){.slide.seen .stamp{animation:none}}
/* 8-week chart */
.rec{width:100%;display:flex;flex-direction:column;gap:12px}
.rec-head{display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;color:var(--muted)}
.rec-head b{font-size:14px;color:var(--ink);font-weight:800}
.weeks{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;align-items:end}
.wk{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0}
.wk .sc{font-size:11px;font-weight:800;color:var(--accent-2);font-variant-numeric:tabular-nums}
.wk .bar{width:70%;height:84px;border-radius:8px;background:var(--soft);display:flex;align-items:flex-end;overflow:hidden}
.wk .bar i{display:block;width:100%;background:var(--accent);border-radius:8px}
.wk.empty .bar{background:transparent;border:1.5px dashed var(--line)}
.wk.empty{padding-top:17px}
.wk .ic{width:100%;max-width:34px}
.wk .ic svg{width:100%;height:auto;display:block}
.wk.empty .ic{display:none}
.wn{font-size:11px;font-weight:700;color:var(--sub)}
.wd{font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums}
.wk.cur .wn{color:var(--accent)}
.wk.cur .bar{box-shadow:0 0 0 2px var(--accent)}
.rec-diff{font-size:13.5px;color:var(--sub)}
.rec-diff b{color:var(--accent)}
.rec-card{width:100%;background:var(--surface);border-radius:22px;box-shadow:var(--sh-2);padding:18px 16px;margin-top:22px}
.reset-box{display:flex;gap:10px;align-items:center;justify-content:center;font-size:12.5px;color:var(--sub);flex-wrap:wrap}
.linkish{appearance:none;border:0;background:none;font:600 12.5px var(--f);color:var(--muted);text-decoration:underline;cursor:pointer;padding:4px}
.linkish.danger{color:var(--alert)}
.same-note{width:100%;padding:12px 14px;border-radius:14px;background:var(--tint);color:var(--sub);font-size:13.5px;line-height:1.6}
.same-note b{display:block;color:var(--accent-2);font-weight:800;margin-bottom:2px}
.same-note u{text-decoration:none;color:var(--ink);font-weight:700}
/* ===== 상세페이지 스타일 인트로 ===== */
.bleed{margin-inline:-20px;width:calc(100% + 40px)}
.hero{margin-top:-20px;background:radial-gradient(120% 70% at 50% 0%,#3A5AAB 0%,#3A5AAB 55%,#3A5AAB 100%);color:#fff;padding:22px 20px 34px;display:flex;flex-direction:column;align-items:center;gap:10px;overflow:hidden;border-radius:0 0 28px 28px}
.pill.dark{background:rgba(255,255,255,.1);color:#ECEFF8;box-shadow:none;backdrop-filter:blur(4px)}
.pill.dark i{background:#3A5AAB}
.glow{position:relative;width:170px;height:170px;display:grid;place-items:center;margin:8px 0 2px}
.glow i{position:absolute;inset:0;border-radius:50%;border:2px solid rgba(92,178,255,.55);animation:ring 2.4s ease-out infinite}
.glow i:nth-child(2){animation-delay:.8s}.glow i:nth-child(3){animation-delay:1.6s}
.glow::before{content:"";position:absolute;inset:18px;border-radius:50%;background:radial-gradient(circle,rgba(92,178,255,.55),rgba(92,178,255,0) 70%);animation:breathe 2.4s ease-in-out infinite}
@keyframes ring{from{transform:scale(.55);opacity:.9}to{transform:scale(1.15);opacity:0}}
@keyframes breathe{50%{transform:scale(1.12);opacity:.7}}
.glow-ch{position:relative;width:118px}
.glow-ch svg{width:100%;height:auto;display:block;animation:bob 2.2s ease-in-out infinite}
.h-dp{font-family:"Pretendard","Noto Sans KR",sans-serif;font-weight:400;letter-spacing:-.01em;line-height:1.25}
.hero .h-dp{font-size:34px;color:#fff}
.hbar{position:relative;padding:6px 18px 8px;margin-top:-2px}
.hbar::before{content:"";position:absolute;inset:0;background:#3A5AAB;border-radius:4px;transform-origin:left;animation:wipe .7s cubic-bezier(.7,0,.2,1) .3s both}
.hbar span{position:relative;font-family:"Pretendard","Noto Sans KR",sans-serif;font-size:38px;color:#FFE45C;line-height:1.2;animation:rise .5s ease .8s both;display:block}
@keyframes wipe{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.h-sub{color:rgba(255,255,255,.78);font-size:15.5px;line-height:1.65;margin-top:6px}
.down{display:flex;flex-direction:column;align-items:center;margin-top:8px}
.down i{width:14px;height:14px;border-right:3px solid #FFE45C;border-bottom:3px solid #FFE45C;transform:rotate(45deg);margin-top:-6px;animation:dn 1.4s ease-in-out infinite}
.down i:nth-child(2){animation-delay:.2s;opacity:.6}
@keyframes dn{0%,100%{transform:translateY(0) rotate(45deg)}50%{transform:translateY(6px) rotate(45deg)}}
.sec{width:100%;display:flex;flex-direction:column;align-items:center;gap:12px;padding:40px 0 8px}
.eyebrow{font-size:12px;font-weight:900;letter-spacing:.18em;color:var(--accent)}
.h-dp.dk{font-size:29px;color:var(--ink)}
.sec-sub{font-size:14.5px;color:var(--sub);margin-top:-4px}
.pop-strip{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;width:100%;padding:14px 10px;background:var(--surface);border-radius:20px;box-shadow:var(--sh-2)}
.pop-strip div{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0;border-radius:12px;min-width:0}
.pop-strip div.ok{background:var(--tint)}
.pop-strip svg{width:100%;max-width:42px;height:auto;display:block}
.pop-strip span{font-size:12px;font-weight:900;color:var(--muted)}
.pop-strip div.ok span{color:var(--accent-2)}
.sec.play .pop-strip div{animation:pop .5s cubic-bezier(.3,1.6,.5,1) both;animation-delay:calc(var(--d)*110ms)}
.sec.play .pop-strip div.ok{animation:pop .5s cubic-bezier(.3,1.6,.5,1) both,glowok 2s ease-in-out 1.2s infinite;animation-delay:calc(var(--d)*110ms),calc(1.2s + var(--d)*150ms)}
@keyframes pop{from{transform:scale(.4) translateY(10px);opacity:0}to{transform:none;opacity:1}}
@keyframes glowok{50%{box-shadow:0 0 0 3px var(--accent)}}
.steps{display:flex;align-items:center;justify-content:center;gap:8px;width:100%}
.steps div{display:flex;flex-direction:column;align-items:center;gap:6px}
.steps b{width:44px;height:44px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:18px;font-weight:900;box-shadow:0 8px 16px -6px rgba(58,90,171,.6)}
.steps span{font-size:13px;font-weight:700;color:var(--sub)}
.steps em{flex:1;max-width:40px;height:2px;margin-bottom:22px;background:repeating-linear-gradient(90deg,var(--accent) 0 5px,transparent 5px 9px)}
.sec.play .steps b{animation:pop .5s cubic-bezier(.3,1.6,.5,1) both}
.sec.play .steps div:nth-child(3) b{animation-delay:.25s}.sec.play .steps div:nth-child(5) b{animation-delay:.5s}
.demo{width:100%;display:flex;align-items:center;gap:14px;background:var(--surface);border-radius:22px;box-shadow:var(--sh-1);padding:16px 18px;margin-top:6px}
.demo-ch{width:70px;flex:none}.demo-ch svg{width:100%;height:auto;display:block}
.demo-t{flex:1;display:flex;flex-direction:column;gap:4px;text-align:left;min-width:0}
.demo-t small{font-size:12px;color:var(--muted)}
.demo-t strong{font-size:34px;font-weight:900;letter-spacing:-.03em;line-height:1.05;font-variant-numeric:tabular-nums}
.demo-t .u{font-size:14px;color:var(--muted);margin-left:2px}
.demo-bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.demo-bar i{display:block;height:100%;width:92%;background:linear-gradient(90deg,#3A5AAB,var(--accent));border-radius:99px}
.sec.play .demo-bar i{animation:growx 1.2s cubic-bezier(.2,.8,.2,1) both}
@keyframes growx{from{width:0}}
.mini-weeks{width:100%;height:150px;display:grid;grid-template-columns:repeat(8,1fr);gap:6px;align-items:end;padding:16px 14px 10px;background:var(--surface);border-radius:20px;box-shadow:var(--sh-2)}
.mini-weeks div{height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px}
.mini-weeks i{display:block;width:70%;height:var(--h);border-radius:6px 6px 3px 3px;background:linear-gradient(180deg,#3A5AAB,var(--accent))}
.mini-weeks div:last-child i{background:linear-gradient(180deg,#FFE45C,#F5B400)}
.mini-weeks span{font-size:10.5px;color:var(--muted);font-weight:700}
.sec.play .mini-weeks i{animation:growy .7s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--d)*90ms);transform-origin:bottom}
@keyframes growy{from{transform:scaleY(0)}}
.sticky-cta{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(180deg,transparent,var(--bg) 35%)}
.sticky-cta .btn{max-width:440px;margin:0 auto;box-shadow:0 12px 24px -8px rgba(58,90,171,.55);animation:nudge 2.6s ease-in-out 1.5s infinite}
@keyframes nudge{0%,88%,100%{transform:none}92%{transform:translateY(-3px)}96%{transform:translateY(1px)}}
.hero~.foot{padding-bottom:96px}
.slide.seen .pbar i{animation:growx 1s cubic-bezier(.2,.8,.2,1) .3s both}
@property --p{syntax:"<number>";inherits:false;initial-value:0}
.slide.seen .ring{animation:ringfill 1.2s cubic-bezier(.2,.8,.2,1) .2s both}
@keyframes ringfill{from{--p:0}}
@media (prefers-reduced-motion:reduce){.glow i,.glow::before,.glow-ch svg,.hbar::before,.hbar span,.down i,.sec.play *,.sticky-cta .btn,.slide.seen .pbar i,.slide.seen .ring{animation:none!important}}
@media (max-width:360px){.hero .h-dp{font-size:29px}.hbar span{font-size:32px}.h-dp.dk{font-size:25px}}
.prod-img{width:100%;max-width:230px;aspect-ratio:1;border-radius:18px;overflow:hidden;background:#fff}
.prod-img img{width:100%;height:100%;object-fit:cover;display:block}
.brand-blk{margin-top:40px;background:#fff;color:#333033;padding:40px 0 0;display:flex;flex-direction:column;align-items:center;gap:12px}
.brand-blk .eyebrow{color:#3A5AAB}
.brand-blk .h-dp{font-size:29px;color:#333033;margin-bottom:14px}
.bimg{display:block;width:100%;max-width:100%;height:auto}
.hero-logo{height:30px;width:auto;margin:6px 0 4px}
.rp-logo{height:26px;width:auto;display:block}
.lineup-img{width:100%;border-radius:22px;overflow:hidden;background:#EDEDEF;box-shadow:var(--sh-2)}
.lineup-img img{display:block;width:100%;height:auto}
.sec.play .lineup-img{animation:rise .7s cubic-bezier(.2,.8,.25,1) both}
/* 네이비 톤 섞기 */
.sec.dark{margin-top:40px;padding:44px 20px 40px;background:radial-gradient(120% 80% at 50% 0%,#3A5AAB 0%,#3A5AAB 60%,#3A5AAB 100%);border-radius:28px;color:#fff}
.sec.dark .eyebrow{color:#8FB8FF}
.sec.dark .h-dp.dk{color:#fff}
.sec.dark .hl{color:#FFE45C}
.sec.dark .steps span{color:rgba(255,255,255,.82)}
.sec.dark .steps b{background:#3A5AAB;box-shadow:0 8px 18px -6px rgba(31,87,224,.8)}
.sec.dark .steps em{background:repeating-linear-gradient(90deg,#FFE45C 0 5px,transparent 5px 9px)}
.sec.dark .fine{color:rgba(255,255,255,.55)}
.sec.dark .demo{background:#fff;color:#333033}
.sec.dark .demo-t small,.sec.dark .demo-t .u{color:#8B95A1}
.sec.dark+.sec{padding-top:44px}
.dark-img{background:#222;line-height:0}
.wrap.res{position:relative}
.res-band{position:absolute;z-index:0;left:-20px;right:-20px;top:-20px;height:318px;background:radial-gradient(120% 90% at 50% 0%,#3A5AAB 0%,#3A5AAB 60%,#3A5AAB 100%);border-radius:0 0 28px 28px}
.wrap.res>*:not(.res-band){position:relative;z-index:1}
.res .top .ghost-link{color:#fff}
.res .slide .head h2{color:#fff}
.res .slide .head .hl{color:#FFE45C}
.res .slide .head p{color:rgba(255,255,255,.8)}
@media (max-width:360px){.res-band{height:300px}}
/* 파스텔 섹션 + 알약 배지 (혜택 배지 스타일) */
.eyebrow{display:inline-block;padding:7px 16px;border-radius:99px;background:var(--accent);color:#fff!important;letter-spacing:.08em;font-size:12.5px}
.sec.dark .eyebrow{background:#3A5AAB}
.brand-blk .eyebrow{color:#fff!important}
.sec.soft-blue,.sec.soft-lav{padding:44px 20px 40px;margin-top:0}
.sec.soft-blue{background:linear-gradient(180deg,#DCEBFF 0%,#EEF5FF 100%)}
.sec.soft-lav{background:linear-gradient(180deg,#E6E9F8 0%,#F3F4FB 100%)}
.sec.soft-lav .hl{color:#3A5AAB}
.sec.soft-lav .eyebrow{background:#3A5AAB}
.sec.soft-blue .h-dp.dk,.sec.soft-lav .h-dp.dk{color:#333033}
.sec.soft-blue .sec-sub,.sec.soft-lav .sec-sub{color:#3A434D}
.sec.soft-blue .strip-lbl{color:#6B7580}
.sec.soft-blue .pop-strip,.sec.soft-lav .mini-weeks{background:#fff}
.sec.soft-blue .pop-strip span{color:#8B95A1}

// 판정용 내부 모양값(1~7): 암스테르담은 가장 가까운 단계로 환산
const ARR=x=>Array.isArray(x)?x:(x==null?[]:[x]);
const WORST=(xs,P)=>{const v=ARR(xs).map(x=>P[x]).filter(Number.isFinite);return v.length?Math.min(...v):0;};
const SHPTAB={ams:{1:6,2:10,3:20,4:26,5:30,6:30,7:8},bitss:{1:8,2:18,3:36,4:40,5:36,6:18,7:8},bristol:{1:8,2:18,3:32,4:40,5:32,6:18,7:8}};
// 모양 중복 선택: 고른 것 전체 / 판정에 쓰는 대표값(가장 신경 쓰이는 모양)
function shapes(a){ return ARR(scaleOf(a)==="ams"?a.ams:a.type).map(Number).sort((x,y)=>x-y); }
function tval(a){ const T=SHPTAB[scaleOf(a)],L=shapes(a).filter(v=>T[v]!=null); if(!L.length) return 4; return L.reduce((b,v)=>(T[v]<T[b]||(T[v]===T[b]&&Math.abs(v-4)>Math.abs(b-4)))?v:b); }
function judge(a){
 const t=tval(a), infant=a.age==="0-6", sc=scaleOf(a);
 let score=0;
 if(t<=2) score-=2; else if(t===3&&sc==="bristol") score-=0.5; else if(t===6) score+=infant?0:1.5; else if(t===7) score+=2.5;
 if(a.freq==="low") score-=1.5; if(a.freq==="mid") score-=infant?1:0.5;
 if(a.freq==="high") score+=infant?0:1;
 if(ARR(a.strain).some(v=>v==="push"||v==="cry")) score-=1;
 let key;
 if(score<=-1.5) key="hard"; else if(score>=1.5) key="loose"; else if(infant&&t===6) key="infant"; else key="good";
 if(key==="good"&&(ARR(a.strain).includes("gas")||(t===3&&sc==="bristol")||a.freq==="mid")) key="care";
 return key;
}

function points(a){

}

function runCounters(root){
 root.querySelectorAll(".cnt").forEach(el=>{
  const to=+el.dataset.to, reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  if(reduce){el.textContent=to;return}
  const t0=performance.now(),dur=1200;
  const tick=t=>{const k=Math.min(1,(t-t0)/dur);el.textContent=Math.round(to*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(tick)};
  requestAnimationFrame(tick);
 });
}

 const els=root.querySelectorAll(".sec");
 if(!("IntersectionObserver" in window)) return;
 const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("play");const c=e.target.querySelector(".cnt");if(c&&!c.dataset.done){c.dataset.done=1;runCounters(e.target)}io.unobserve(e.target)}}),{threshold:.25});
 els.forEach(el=>io.observe(el));
}

 {const hz=document.querySelector(".hw-roll.hz");if(hz){const ul=hz.querySelector("ul"),n=ul.children.length,dots=[...hz.querySelectorAll(".hw-dots i")];let k=0,t;
  const go=i=>{k=(i+n)%n;ul.style.transform=`translateX(${-k*100}%)`;dots.forEach((d,j)=>d.classList.toggle("on",j===k));};
  const auto=()=>{clearInterval(t);t=setInterval(()=>go(k+1),3200);};
  hz.querySelector(".hw-ar.l").onclick=()=>{go(k-1);auto();};hz.querySelector(".hw-ar.r").onclick=()=>{go(k+1);auto();};
  let sx=null;ul.addEventListener("touchstart",e=>{sx=e.touches[0].clientX},{passive:true});ul.addEventListener("touchend",e=>{if(sx==null)return;const dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>30){go(k+(dx<0?1:-1));auto();}sx=null;});
  auto();}}
 {const dv=document.querySelector(".device.pc");if(dv){const tr=dv.querySelector(".pc-track"),dots=[...dv.querySelectorAll(".pc-dots button")],bar=dv.querySelector(".pc-timer i"),lab=dv.querySelector(".pc-timer span");
  const DWELL=6;let p=0,left=DWELL,t=null,started=false;
  const go=i=>{p=(i+2)%2;tr.style.transform=`translateX(${-p*100}%)`;dots.forEach((d,j)=>d.classList.toggle("on",j===p));dv.classList.toggle("on-hw",p===1);if(p===1)stop();};
  const stop=()=>{clearInterval(t);t=null;dv.classList.add("t-done");};
  const tick=()=>{left--;lab.textContent=left>0?`${left}초 후 원료 정보로 넘어가요`:"";bar.style.width=((DWELL-left)/DWELL*100)+"%";if(left<=0){go(1);}};
  const start=()=>{if(started)return;started=true;dv.classList.add("t-on");return;left=DWELL;lab.textContent=`${left}초 후 원료 정보로 넘어가요`;bar.style.width="0%";t=setInterval(tick,1000);};
  const reset=()=>{if(p!==0||!started)return;clearInterval(t);left=DWELL;bar.style.width="0%";lab.textContent=`${left}초 후 원료 정보로 넘어가요`;t=setInterval(tick,1000);};
  dv.querySelector(".pc-ar.l").onclick=()=>go(p-1);dv.querySelector(".pc-ar.r").onclick=()=>go(p+1);dots.forEach(d=>d.onclick=()=>go(+d.dataset.p));
  dv.querySelectorAll(".road [data-stage],.p-nav").forEach(x=>x.addEventListener("click",reset));
  if("IntersectionObserver" in window){const o=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting&&e.intersectionRatio>.6){start();o.disconnect();}}),{root:document.getElementById("slides"),threshold:[.6]});o.observe(dv.closest(".slide"));setTimeout(start,6000);}else start();}}
